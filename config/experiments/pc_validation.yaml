# Pc engine independent validation (REVIEWER_CHECKLIST RP4): pre-registered values.
#
# RECONSTRUCTED on 2026-10-14 from a draft lost with the D: project folder before it was ever
# committed (DECISIONS.md, 2026-10-14 reconstruction entry). CONFIRMED by Sidh on 2026-10-24
# (DECISIONS.md, 2026-10-24 confirmation entry), with the amendments marked below. This file was
# updated in the same commit as that entry, BEFORE any validation code existed. No comparison has run.
#
# This file is read only by the validation runner. It is NOT merged into config/default.yaml, so the
# base config hash (00d1cb2d..., the key of every search cache) is unchanged. The runner stamps this
# file's SHA-256 into its provenance.

seed: 42                       # sampling seed (Sidh's spec)

sample:
  # Official-test target-defining CDMs (the rows E14 recomputed), stratified by reported log10 risk
  # using E3's pre-specified edges (config pc_spike.risk_strata_edges). Confirmed 2026-10-24:
  # population sizes floor 1,673; (-30,-15] 108; (-15,-10] 138; (-10,-6] 98; (-6,0] 150.
  official_test:
    take_all_strata: ["(-6, 0]"]          # all 150 high-risk events
    per_stratum_n: 30                     # floor, (-30,-15], (-15,-10], (-10,-6]
    # Draw (checklist item 2, as drafted): numpy.random.default_rng(seed), without replacement,
    # strata in the order floor, (-30,-15], (-15,-10], (-10,-6]; event_uid sorted before drawing.
  # E3's existing 100 training-pool CDMs, matched on (event_uid, time_to_tca); all 100 match
  # uniquely with reported == risk (confirmed 2026-10-24, item 3). Reported as a SECOND set, not
  # pooled (item 4, as drafted).
  e3_sample: true

engine:
  n_radial: 200                # the grid E3 and E14 used (config labelnoise.integration)
  n_angular: 360
  refined_factor: 2            # self-convergence at 2x grid, i.e. 400 x 720

gate_m1_m3:
  max_median_abs_dlog10: 0.005 # step (ii): M1 vs M3 must agree, else outcome b'

agreement:
  tau_floor: 0.01              # tau_s = max(tau_floor, tau_mult * e_s)
  tau_mult: 3.0                # e_s = per-stratum 95th pct of |engine(2x) - engine(1x)|
  min_frac_within: 0.95
  max_abs_any: 0.1
  max_median_abs: 0.005
  # Item 9, AMENDED (Sidh 2026-10-24): agreement requires the engine to agree with BOTH M1 and M3,
  # and an engine evaluation error counts as a DISAGREEMENT (it is not excluded).
  require_both_m1_m3: true
  engine_errors_count_as_disagreement: true
  # SET by Sidh on 2026-10-25, before any real-data run (was OPEN, null): an event with no valid
  # independent value (M1 non-convergence, or M3 "not informative") is EXCLUDED from that method's
  # agreement fractions. Engine evaluation errors still count as disagreements (above). Excluded
  # events are listed per stratum. A stratum is classed "not informative" if more than 10% of its
  # events lack an M1 or an M3 value.
  missing_independent_value_policy: exclude
  list_excluded_events_per_stratum: true
  not_informative_if_frac_missing_above: 0.10

m1:                            # deterministic 1D reduction, adaptive Gauss-Kronrod (item 6)
  epsrel: 1.0e-10
  limit: 500
  # Item 6, AMENDED: non-convergence (quad reports ier != 0) is an EVENT-LEVEL FAILURE of M1 for
  # that event. These settings are never loosened afterwards.
  nonconvergence: event_level_failure
  # Implementation constant, fixed before any run (Claude Code, 2026-10-24): number of points in
  # t = asin(x / HBR) used to locate the integrand's peak, which is factored out in log space and
  # passed to quad as a breakpoint.
  peak_grid_points: 2001

m3:                            # uniform-in-disk Monte Carlo of the density, log space (item 7)
  n_samples: 1000000
  # Item 7, AMENDED (Sidh 2026-10-24): target relative SE 0.5%. If missed at n_samples, rerun once
  # with n_escalated samples. If still above target at n_escalated, the event is "not informative"
  # for M3.
  rel_se_target: 0.005
  n_escalated: 10000000
  # Implementation constant, fixed before any run: samples are drawn in chunks of this size
  # (memory). It fixes the order of draws from the per-event generator, seeded 42 + sample index.
  chunk: 1000000
  # Seed stream (Sidh 2026-10-25): per-event seed = seed + seed_offset + sample index.
  seed_offset: 0

m2:                            # plain Monte Carlo on the encounter plane (item 8, as drafted)
  chunk: 10000000
  cap: 100000000               # per-event sample cap
  min_hits_target: 100         # stop once relative SE <= 10% (~100 hits)
  max_rel_se_counted: 0.10     # counted only if relative SE <= 10%; else "not informative"
  n_se: 3.0                    # judged within 3 SE, in log10 via the delta method
  # Seed stream (Sidh 2026-10-25): M2 has its own stream, distinct from M3's. Per-event seed =
  # seed + seed_offset + sample index. The offset exceeds any sample index, so no M2 seed equals any
  # M3 seed.
  seed_offset: 1000000

reported_tolerance: 0.5        # the existing engine-vs-reported tolerance, unchanged

constants:
  # Implementation constant, fixed before any run: Earth's gravitational parameter GM (WGS-84),
  # km^3/s^2, used only by C3a/C3b's circular-orbit speed sqrt(mu / a_t).
  mu_earth_km3_s2: 398600.4418

conventions:                   # Item 11 (Sidh 2026-10-24): the convention section copied in the
                               # 2026-10-24 confirmation entry. All run through the engine, inputs only.
  - id: C0
    description: baseline engine conventions (HBR = (t_span + c_span)/2; both covariances summed in one RTN frame)
  - id: C1
    role: negative_control     # exempt from the E3/E14 flag rule; governed by the insensitivity rule
    description: x_span read as a radius, HBR = t_span + c_span (HBR doubled)
    expected_median_dlog10: 0.602   # log10 4; reported per stratum against this, NO pass/fail threshold
    insensitivity_threshold_pp: 10.0
  - id: C3a
    description: chaser covariance rotated into the target RTN frame about R by the crossing angle, circular-orbit approximation, relative velocity = chaser - target
  - id: C3b
    description: as C3a with relative velocity = target - chaser
  - id: C4a
    description: max-risk anchor, Pc(k * C) vs max_risk_estimate, k = max_risk_scaling as a VARIANCE factor
  - id: C4b
    description: max-risk anchor, Pc(k^2 * C) vs max_risk_estimate, k = max_risk_scaling as a SIGMA factor
# YAML syntax fix (Claude Code, 2026-10-24, before any run): these two keys sat inside the list above,
# which made the file unparseable since 2026-10-14. Lifted to top level with a prefix; values unchanged.
conventions_dropped:
    - id: C2
      reason: chaser 2 m minimum diameter already applied in the data (c_span >= 2.0 in all 2,167 official-test target CDMs and all 162,634 training CDMs; confirmed on re-ingested data 2026-10-24, item 12)
conventions_material_change_pp: 10.0     # a change in overall within-0.5 agreement > 10 pp (conventions other than C1) is a finding; flags E3's partial hold and E14 for Sidh's review
