# =============================================================================
# config/default.yaml — canonical configuration for the Kelvins-conformal project
# -----------------------------------------------------------------------------
# CLAUDE.md §12: seeds, paths, thresholds, grids, and cost ratios live HERE, never
# as inline magic numbers in source. Every stochastic component reads `seed` from
# this file. The config is loaded + hashed (config.py); the hash stamps every
# artifact (invariant I4).
#
# Values marked "[verify]" are relied upon from the challenge documentation and
# must be confirmed against the extracted source before the experiment that uses
# them is trusted (CLAUDE.md §10: never assert an unverified fact as exact).
# =============================================================================

# --- Reproducibility --------------------------------------------------------
seed: 42                     # global master seed (CLAUDE.md §1: determinism is a requirement)
n_seeds: 3                   # >=3 seeds for stochastic components (Q-STAT-05 (a), frozen now)
bootstrap:
  n_resamples: 2000          # >=2,000 event-level resamples on headline metrics (CLAUDE.md §9)
  unit: event                # bootstrap resamples WHOLE events, never CDM rows (invariant I3)

# --- Paths (relative to repo root) ------------------------------------------
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  events_parquet: data/processed/events.parquet
  reports_dir: reports
  figures_dir: reports/figures
  tables_dir: reports/tables

# --- E0: dataset acquisition & integrity ------------------------------------
dataset:
  # Canonical source (PROJECT_KNOWLEDGE.md §16; EXPERIMENT_PLAN.md E0).
  doi: "10.5281/zenodo.4463683"
  url: "https://zenodo.org/records/4463683/files/Collision%20Avoidance%20Challenge%20-%20Dataset.zip?download=1"
  zip_filename: "Collision Avoidance Challenge - Dataset.zip"
  md5: "d19dc8875229f2f6893253c38adddc87"   # abort loudly on any mismatch (E0 failure criterion)

# --- Q-METH-01 (RESOLVED 2026-08-01): prediction target definition ----------
# Decision: regress RAW log-risk, INCLUDING floor/sentinel values. No censoring,
# no two-part/Tobit model. Chosen for comparability with all prior work on this
# dataset (required for E5 baseline validation). See DECISIONS.md.
target:
  column: risk               # the reported log10(Pc) value in each CDM
  definition: raw_log_risk   # {raw_log_risk | clipped | censored} -> raw_log_risk (resolved)
  include_floor: true        # floor/sentinel rows are kept as-is (NOT dropped or censored)
  per_event: final_cdm       # target = risk of the FINAL CDM of the event (challenge task)
  # Documented sentinel for "negligible risk"; VERIFIED empirically in the E1 audit
  # (Q-DATA-02: report floor mass fraction). Do not use this to silently coerce data.
  floor_sentinel_value: -30.0   # [verify] against the observed minimum in E1

# --- Q-METH-02 (RESOLVED 2026-08-01): prediction cutoff / lead-time rules ----
# Decision: replicate the ORIGINAL challenge cutoff rules EXACTLY as primary.
# These values are the challenge's own definitions (Uriot et al. 2022; Kelvins
# scoring page), extracted in E0/E1 — NOT invented here. Any custom cutoff is a
# clearly-labelled secondary analysis only, never a substitute. See DECISIONS.md.
# VERIFIED at E5 (2026-08-01): both values are stated verbatim in Uriot et al.,
# arXiv:2008.03069v2 §4.2 (test-set eligibility constraints i-iii), and are further
# confirmed by E5 reproducing the published LRP baseline scores exactly on BOTH the
# test set and the eligibility-filtered training set. The '[verify]' markers that
# stood here through Phase 0 are therefore lifted.
cutoff:
  # Participants predict the final risk using only CDMs available up to this many
  # days before TCA: a CDM is usable as input iff time_to_tca >= cutoff_days.
  # (§4.2 iii: "The first CDM released for the event had to be at least 2 days
  # before TCA and all the CDMs that were within two days from TCA were removed".)
  cutoff_days_before_tca: 2.0        # VERIFIED (challenge rule)
  # The official TEST set was restricted to events whose LATEST CDM lands within
  # this many days of TCA (§4.2 ii) - the documented recency filter component of
  # the selection bias, quantified in E1 and reconfirmed in E5.
  test_recency_filter_days: 1.0      # VERIFIED (challenge test-construction rule)
  # §4.2 i: an eligible event must contain at least this many CDMs.
  min_cdms_per_event: 2              # VERIFIED (challenge rule)

# --- E5: challenge metric + baseline validation ------------------------------
# All values here are the challenge's OWN definitions, extracted from
# Uriot et al., arXiv:2008.03069v2 (§4.1, §4.3, §4.4, Tables 3-4) — the
# Astrodynamics 2022 paper's preprint. Nothing here is invented by us.
metric:
  # Eq. (1): L = MSE_HR / F2. F2 over ALL test events; MSE_HR over events whose
  # TRUE risk >= high_risk_threshold.
  f_beta: 2.0
  # §4.3: "all risk predictions can be clipped at a value slightly lower than
  # 1e-6 to improve the overall score ... we make use of this clipping and the
  # scores ... are reported after the clipping has been applied, using eps=0.001".
  prediction_clip_epsilon: 0.001      # predictions below threshold -> -6.001
  # Documented conventions for the metric's undefined cases (METRICS.md §1, §2).
  # These are DEFINED behaviours, never silent NaNs.
  f2_zero_convention: infinite        # F2 == 0 -> L reported as +inf and flagged
  empty_high_risk_convention: undefined  # n_HR == 0 -> L undefined, subset unscorable

baselines:
  # §4.4 CRP (Constant Risk Prediction): predicts a constant -5 for every event.
  constant_value: -5.0
  # §4.4 LRP (Latest Risk Prediction): the clipped naive forecast, using r_{-2},
  # the latest known risk from a CDM released at least `cutoff_days_before_tca`
  # before TCA.
  persistence_uses_last_cdm_at_or_before_cutoff: true

baseline_validation:
  # Published reference values (Uriot et al., Tables 3 and 4; §4.4 for CRP).
  # PRE-REGISTERED agreement tolerances -> DECISIONS.md, PROPOSED, awaiting Sidh.
  published:
    lrp_test:  { loss: 0.694, mse_hr: 0.513, f2: 0.739 }
    lrp_train: { loss: 0.804, mse_hr: 0.330, f2: 0.411 }
    crp_test:  { loss: 2.5 }
  tolerance:
    primary_abs: 0.001    # agreement at the published rounding precision
    secondary_abs: 0.01   # "close but not exact" -> partial match, investigate
    crp_abs: 0.05         # CRP L is published to 2 significant figures only

# --- E6/E7/E8: feature building and model training ---------------------------
features:
  # Number of most-recent admissible CDMs summarised into the tabular feature set
  # (EXPERIMENT_PLAN E6: "last-k-CDM features").
  last_k: 3
  # Maximum sequence length for the recurrent models (E7/E8). Events with more
  # admissible CDMs keep the k most recent; shorter ones are padded and MASKED.
  max_sequence_length: 10
  # Whether STRICTLY PRE-CUTOFF risk history may be used as a model feature.
  # See DECISIONS.md "CONFLICT FLAGGED: feature_dictionary.yaml's risk verdict"
  # — PROPOSED, awaiting Sidh. The final-CDM (target) risk is NEVER usable under
  # either setting; that is enforced by assertion, not by this flag.
  risk_history: true
  # The dictionary's two 'ambiguous' columns. Its own stated conservative option
  # is exclusion, which is what `false` here means. Not re-litigated (E2).
  include_ambiguous: false
  # Columns the feature builder must never emit, whatever else changes.
  # Mirrors feature_dictionary.yaml's `unsafe` verdicts.
  hard_excluded: [event_id, risk]

# Internal split of the TRAINING POOL only. The official test set is not part of
# this and is untouched until each experiment's single final scoring pass.
# The Phase-3 `calibration` and `self_test` shares (Q-SEL-02) are carved here too
# and left ALONE in Phase 2, so early stopping never contaminates them.
model_split:
  inner_validation_fraction: 0.20   # share of the `fit` pool held out for early stopping / HPO

train:
  n_seeds: 3                    # >=3 seeds for every reported model number (CLAUDE.md §9)
  seeds: [42, 43, 44]
  # Hyperparameter search budget. Held EQUAL across E6/E7/E8 so the E8 steelman
  # is auditable rather than asserted (Q-BASE-02 option (c)).
  hpo_budget_trials: 24
  early_stopping_rounds: 50

gbm:
  # LightGBM. Quantile heads are built now because Phase 3's CQR (E12) needs them,
  # even though nothing in Phase 2 consumes them.
  quantile_levels: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
  num_boost_round: 2000

# Promotion-threshold grid shared by E6/E7/E8 (see DECISIONS.md, PROPOSED).
# An L2 regressor on this floor-dominated target never crosses the -6 threshold,
# giving F2 = 0 and an undefined challenge loss. The challenge's own top team
# solved this with exactly such a promotion cascade (Uriot et al. Table 4).
# `tau` is chosen on val_inner ONLY; the grid is fixed here in advance.
decision_rule:
  promotion_thresholds: [-12.0, -11.0, -10.0, -9.5, -9.0, -8.5, -8.0, -7.5,
                         -7.0, -6.5, -6.0, -5.5, -5.0]
  promotion_margin: 0.001   # promoted events land at threshold + margin = -5.999

sequence:
  cell: gru                     # {gru | lstm}
  hidden_size: 64
  num_layers: 1
  dropout: 0.2
  batch_size: 128
  max_epochs: 60
  learning_rate: 0.003

bayesian:
  # E8 MC-dropout (Pinto et al. family) + a small deep ensemble.
  n_mc_samples: 200             # forward passes at inference
  ensemble_size: 5
  # Nominal levels per the Gate 1 resolution of Q-STAT-01.
  nominal_levels: [0.80, 0.90, 0.95]

# --- E4: statistical power analysis (Gate 1) --------------------------------
power:
  # Q-STAT-01 (PROPOSED): 90% primary, {80, 95} reported as secondary levels.
  nominal_coverage_primary: 0.90
  nominal_coverage_secondary: [0.80, 0.95]
  # Event-level calibration fractions of the TRAIN pool (EXPERIMENT_PLAN E4).
  calibration_fractions: [0.10, 0.20, 0.30]
  # Q-STAT-02 (PROPOSED): "useful precision" = 95% CI half-width on empirical
  # coverage at or below this many percentage points.
  useful_half_width_pp: 5.0
  secondary_half_width_pp: 10.0
  # Monte Carlo repetitions of the (calibration draw -> test draw) experiment.
  n_simulations: 2000
  # Group sizes swept to locate the Q-CONF-02 merging floor.
  group_size_grid: [5, 10, 15, 20, 25, 30, 40, 50, 75, 100, 150, 200, 300, 500]

# --- High-risk classification threshold (challenge definition) --------------
# The competition labels an event "high risk" iff its final risk > this value
# (log10 Pc). Drives the F2 component of the challenge metric and the audit's
# high-risk-prevalence figures. [verify] against the scoring page in E5.
high_risk_threshold: -6.0

# --- Q-METH-03 (RESOLVED 2026-08-01): interval sidedness --------------------
# NOTE: not exercised in Phase 0 (no conformal code yet). Recorded here so the
# Phase-3 conformal API is built for both from the start. Two-sided is the default
# descriptive/coverage presentation; one-sided upper bounds feed decision-cost.
interval:
  sidedness: both            # {two_sided | upper | both} -> both (resolved)
  default_presentation: two_sided

# --- Q-SEL-02 (RESOLVED 2026-08-01): evaluation split(s) used ---------------
# NOTE: not exercised in Phase 0. Both an exchangeable self-split (validates the
# machinery) AND the official biased test set (demonstrates bias + correction)
# are used, with distinct pre-declared roles. data.py must produce both.
splits:
  use_self_split: true       # exchangeable, randomly sampled from the train pool
  use_official_test: true    # the precious, read-once official Kelvins test set
  self_split_fractions:      # event-level fractions of the TRAIN pool (later phases)
    fit: 0.6
    calibration: 0.2
    self_test: 0.2

# --- E3: Pc recomputation feasibility spike ---------------------------------
pc_spike:
  n_sample_cdms: 100         # ~100 CDMs, stratified across risk levels (E3 spec)
  n_risk_strata: 5           # stratification bins for the sample
  # Fixed, pre-specified log10-risk band edges defining those 5 strata. Declared
  # here (not derived from the data) so the sampling design cannot be accused of
  # being tuned to the comparison it feeds. Bands are (lower, upper]; the first is
  # the floor atom itself, the last is the challenge's high-risk band. Equal
  # numbers of CDMs are drawn per non-empty stratum, so the sample spans the risk
  # range instead of being swamped by the floor (which is ~40% of all CDM rows).
  risk_strata_edges: [-30.0, -15.0, -10.0, -6.0, 0.0]
  # PROPOSED tolerance for "recomputed risk agrees with reported risk". This is a
  # PRE-REGISTRATION value: it is written to DECISIONS.md as PROPOSED and awaits
  # Sidh's confirmation BEFORE the comparison is interpreted (CLAUDE.md §3, §10).
  # The spike may compute the comparison, but the go/no-go on A4 is Sidh's call.
  tolerance:
    abs_log10_risk: 0.5      # |recomputed - reported| in log10 units, per CDM
    min_proportion_within: 0.80   # fraction of the sample that must fall within it
