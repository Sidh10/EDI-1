meta:
  experiment: E2 — Feature dictionary & leakage audit
  source: Descriptions condensed from raw_data/raw_data_2015-2019.txt (ESA Kelvins release).
  cutoff_rule: 'Challenge 2-day prediction cutoff (Q-METH-02, resolved): only CDMs with time_to_tca >=
    2 days are model inputs. Enforced at the CDM-row level; the public test_data.csv already contains
    only such CDMs (min time_to_tca = 2.0).'
  classification_scheme:
    safe: Usable as a predictor from any admissible (pre-cutoff) CDM.
    unsafe: Must not be used as a feature (target or pure identifier).
    ambiguous: Defensible but contestable; flagged for the modelling decision, conservative option is
      exclusion.
  tally:
    safe: 99
    unsafe: 2
    ambiguous: 2
  total_columns: 103
  note: Only 2 columns are ambiguous (max_risk_estimate, max_risk_scaling) — within a handful, so no blanket
    conservative-exclusion fallback is triggered; the conservative option is recorded per-column instead
    (E2 success criterion).
features:
  event_id:
    description: Unique id per collision event.
    role: identifier
    availability: per_cdm
    leakage_class: unsafe
    rationale: Pure event identifier; using it as a predictor memorises events and does not generalise.
      Excluded from any feature set (kept only for grouping/splitting).
  time_to_tca:
    description: Time interval between CDM creation and time-of-closest-approach [days].
    role: feature
    availability: per_cdm
    leakage_class: safe
    rationale: The CDM's own age relative to TCA; known when the CDM is issued. Central to cutoff logic
      and to recency-weighted models. No leakage.
  mission_id:
    description: Identifier of the ESA mission that would be affected.
    role: group_key
    availability: per_cdm
    leakage_class: safe
    rationale: Known a priori for every CDM. Usable both as a categorical feature and as the grouping
      key for group-conditional calibration (Q-DATA-01). No temporal leakage.
  risk:
    description: Self-computed collision risk at the epoch of each CDM [base-10 log]. TARGET = value in
      the final CDM of each event.
    role: target
    availability: per_cdm
    leakage_class: unsafe
    rationale: This IS the prediction target (final-CDM risk). It must never be used as a concurrent feature.
      Only strictly pre-cutoff observed risk values may be used, and only as the explicit persistence
      baseline input (E5), not as a generic feature.
  max_risk_estimate:
    description: Maximum collision probability obtained by scaling the combined covariance.
    role: feature
    availability: per_cdm
    leakage_class: ambiguous
    rationale: 'Risk-adjacent: a per-CDM transform of the same covariance the risk is computed from. Temporally
      available pre-cutoff (safe by construction), but a reviewer may view it as a near-proxy of the label.
      Flagged for the Phase-3 modelling decision; conservative option is to exclude it. Not silently defaulted
      to safe.'
  max_risk_scaling:
    description: Scaling factor used to compute max_risk_estimate.
    role: feature
    availability: per_cdm
    leakage_class: ambiguous
    rationale: 'Risk-adjacent: a per-CDM transform of the same covariance the risk is computed from. Temporally
      available pre-cutoff (safe by construction), but a reviewer may view it as a near-proxy of the label.
      Flagged for the Phase-3 modelling decision; conservative option is to exclude it. Not silently defaulted
      to safe.'
  miss_distance:
    description: Relative position between chaser & target at TCA [m].
    role: feature
    availability: per_cdm
    leakage_class: safe
    rationale: Recorded per CDM and available at every cutoff (the 2-day cutoff is enforced at the CDM-row
      level, so all fields of an admissible CDM are legitimately usable). No target leakage.
  relative_speed:
    description: Relative speed between chaser & target at TCA [m/s].
    role: feature
